name: Security

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - ".gitmodules"
      - "Vendor/libghostty"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - ".gitmodules"
      - "Vendor/libghostty"
      - ".github/workflows/security.yml"
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-swift:
    name: CodeQL (Swift)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      # SwiftPM validates every local binary target even for a targeted build,
      # so create GhosttyKit before CodeQL enables its DYLD tracer.
      - name: Install verified build toolchain
        run: |
          Scripts/install-zig-ci.sh
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache libghostty xcframework
        id: cache-ghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/libghostty/macos/GhosttyKit.xcframework
          key: ghostty-xcframework-${{ hashFiles('.gitmodules', 'Vendor/libghostty/build.zig') }}

      - name: Build libghostty xcframework outside CodeQL tracing
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: Scripts/bootstrap.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: swift
          queries: security-extended

      # CodeQL's DYLD tracer cannot import the prebuilt GhosttyKit module.
      # Analyze the independent data + agent libraries here; full app/core
      # compilation and tests remain mandatory in CI.
      - name: Build independently analyzable Swift targets
        run: |
          swift build --target HerminalDB
          swift build --target HerminalAgent

      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:swift
