# Capture the README / press-kit screenshots on a macOS runner.
#
# Local capture needs Screen Recording + Accessibility TCC grants that are
# painful to arrange on a developer machine; the hosted macOS runner has a
# GUI session with both pre-seeded, so Scripts/capture-screenshots.sh can
# drive the real app there instead. Reuses the app already built by CI —
# no rebuild.
#
# Manual trigger only. Screenshots land as a downloadable artifact; a human
# reviews them before anything is committed.

name: Capture screenshots

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Uses the ref this run was dispatched on, so a UI branch can be
      # reviewed visually before it merges. Dispatching on main behaves as
      # before; the branch's own CI must have gone green first.
      - name: Locate the newest CI app build for this ref
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
            --jq '.workflow_runs[0]')
          if [ "$run" = "null" ] || [ -z "$run" ]; then
            echo "::error::No successful ci.yml run on ${{ github.ref_name }} yet."
            exit 1
          fi
          run_id=$(echo "$run" | jq -r .id)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$run" | jq -r .head_sha)" >> "$GITHUB_OUTPUT"
          # Read the artifact's real name rather than rebuilding it from a
          # SHA: a pull_request run stamps github.sha with its merge commit,
          # which is not the run's head_sha.
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("herminal-app-")) | .name' | head -1)
          if [ -z "$name" ]; then
            echo "::error::Run $run_id has no herminal-app-* artifact (expired?)."
            exit 1
          fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"

      - name: Download the built app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.locate.outputs.artifact }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .build/herminal.app

      - name: Make the app launchable
        run: |
          chmod +x .build/herminal.app/Contents/MacOS/HerminalApp
          codesign --force --deep -s - .build/herminal.app
          xattr -dr com.apple.quarantine .build/herminal.app || true

      - name: Prepare the runner desktop
        run: |
          # Dock would draw over the window region on the small display.
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          # The dashboard's TMUX section reads better than "tmux is not
          # installed".
          brew install -q tmux || true
          # macOS 15 shows a one-time "bypass the window picker" consent
          # dialog on the first legacy screencapture. Trigger it with a
          # throwaway capture and click Allow so it never pollutes a shot.
          screencapture -x /tmp/warm.png || true
          sleep 3
          osascript -e 'tell application "System Events" to tell (first process whose name contains "UserNotificationCenter") to click button "Allow" of window 1' || true
          sleep 1

      - name: Stub an agent CLI for the dashboard shot
        run: |
          # A real Mach-O binary named claude, so the process's p_comm is
          # exactly "claude" (a shebang script would report the shell).
          sudo cp /bin/sleep /usr/local/bin/claude
          sudo chmod +x /usr/local/bin/claude

      - name: Capture
        env:
          HERMINAL_SHOT_CWD: ${{ github.workspace }}
          HERMINAL_SHOT_SPAWN_AGENT: "1"
        run: Scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots-${{ steps.locate.outputs.sha }}
          path: docs/assets/screenshot-*.png
          if-no-files-found: error
