name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "App/**"
      - "Scripts/**"
      - ".gitmodules"
      - "Vendor/libghostty"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "App/**"
      - "Scripts/**"
      - ".gitmodules"
      - "Vendor/libghostty"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"

# Cancel any in-flight run for the same PR / branch when a new commit lands.
# Saves runner minutes and avoids redundant work on rapid iterations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SwiftPM validates every local binary target even when a filtered test does
  # not import it, so a "core-only" lane without GhosttyKit cannot work. Build
  # the pinned framework once, cache it, then run the complete suite on every PR.
  full-build:
    name: Full build + app tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify fail-closed release guards
        run: Scripts/verify-release-guards.sh

      - name: Verify owner gate tools
        run: Scripts/verify-owner-gate-tools.sh

      - name: Check diagnostics privacy
        run: Scripts/check-diagnostics-privacy.py

      - name: Install verified build toolchain
        run: |
          Scripts/install-zig-ci.sh
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache libghostty xcframework
        id: cache-ghostty
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Vendor/libghostty/macos/GhosttyKit.xcframework
          # Bump the cache key by the submodule SHA so any libghostty
          # update invalidates the cached framework automatically.
          key: ghostty-xcframework-${{ hashFiles('.gitmodules', 'Vendor/libghostty/build.zig') }}

      - name: Cache SPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-fullbuild-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-fullbuild-

      - name: Build libghostty xcframework (if not cached)
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: Scripts/bootstrap.sh

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: swift build
        run: swift build

      - name: swift test (full suite)
        run: swift test

      - name: Assemble .app bundle
        run: Scripts/make-app-bundle.sh

      - name: Upload built bundle as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herminal-app-${{ github.sha }}
          path: .build/herminal.app
          # 7 days is enough for triage; longer wastes free-tier storage.
          retention-days: 7
