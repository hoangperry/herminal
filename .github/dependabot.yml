version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - swift
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      reviewed-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major Action upgrades can change runtime/permissions and need one
      # coordinated maintainer review, not five independent bot PRs.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
