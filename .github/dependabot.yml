version: 2
updates:
  # Swift Dependabot executes `swift package` before submodules/toolchains are
  # available and cannot parse this package's local GhosttyKit binary target.
  # Package.resolved changes therefore stay maintainer-reviewed; GitHub Actions
  # updates remain automated below.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      reviewed-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major Action upgrades can change runtime/permissions and need one
      # coordinated maintainer review, not five independent bot PRs.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
